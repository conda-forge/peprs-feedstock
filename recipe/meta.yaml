{% set version = "0.2.5" %}

package:
  name: peprs
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/peprs/peprs-{{ version }}.tar.gz
  sha256: b1727273ed32e313b2244b0a96b9dbcaf90041923dfc8522e102c7cfd64da839

build:
  entry_points:
    - peprs = peprs:_cli_main
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1.9,<2.0
    - pip
  run:
    - python
    - polars
    - pyarrow

test:
  imports:
    - peprs
  commands:
    - pip check
    - peprs --help
  requires:
    - pip
    - python

about:
  home: https://github.com/pepkit/peprs/
  summary: Rust-powered PEP sample metadata toolkit for Python
  license: MIT
  license_file:
    - LICENSE.txt
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - khoroshevskyi
    - nleroy917
